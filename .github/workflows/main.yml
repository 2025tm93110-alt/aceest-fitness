name: ACEest CI/CD

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Syntax check (compile)
        run: python -m compileall -q app.py tests
      - name: Lint with flake8
        run: flake8 .

  docker:
    name: Docker Build & Test
    needs: build-and-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          load: true
          tags: aceest-fitness:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run Pytest inside the container
        run: docker run --rm aceest-fitness:test
      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: aceest-fitness:ci
          cache-from: type=gha
      - name: Smoke test runtime container
        run: |
          docker run -d --name aceest -p 5000:5000 aceest-fitness:ci
          for i in $(seq 1 15); do
            curl -fs http://localhost:5000/health && exit 0
            sleep 1
          done
          docker logs aceest
          exit 1
